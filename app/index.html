<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>삿포로 여행 일정표</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="description" content="8월 24일-28일 삿포로 여행 일정표">
<meta name="theme-color" content="#3182F6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="삿포로 여행">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* ==========================================================
     Structure/tokens carried over from the 경주 여행 일정표 앱
     (same layout, same Teams UI Kit-derived scale for spacing/
     radius/elevation/typography). Brand hue swapped from Teams
     purple to Toss Blue (#3182F6) per request; category accents
     re-picked from Toss's palette (orange/mint/red/purple) so
     they stay distinct from the new brand blue.
     ========================================================== */
  :root{
    --brand-primary-rgb: 49 130 246;     /* #3182F6 Toss Blue */
    --brand-primary-pressed: rgb(21,79,173);  /* #154FAD */
    --brand-tint: rgb(235,242,254);

    --fg-default: rgb(36,36,36);
    --fg-secondary: rgb(51,51,51);
    --fg-tertiary: rgb(51,51,51);
    --fg-on-brand: rgb(255,255,255);

    --surface-canvas: rgb(255,255,255);
    --surface-card: rgb(245,245,245);
    --surface-sunken: rgb(250,250,250);

    --border-default: rgb(225,223,221);
    --border-subtle: rgb(237,235,233);
    --border-strong: rgb(205,205,205);

    --status-info-rgb: 2 132 199;       /* flight — sky blue, distinct from the Toss-blue brand hue */
    --status-warning-rgb: 255 139 36;   /* food — Toss orange */
    --status-urgent-rgb: 233 89 217;    /* ticket */
    --status-danger-rgb: 240 68 82;     /* pending/undecided — Toss red */
    --leisure-rgb: 0 173 145;           /* free time — Toss mint */
    --transport-rgb: 124 92 239;        /* transport — indigo, distinct from sky-blue flight & magenta ticket */
    --exchange-rgb: 22 163 74;          /* exchange — green, cash-like, distinct from mint leisure */
    --tint-alpha: 0.1;

    --radius-small: 2px;
    --radius-medium: 4px;
    --radius-large: 8px;
    --radius-pill: 9999px;

    --shadow-4: 0px 0px 2px rgba(0,0,0,0.12), 0px 2px 4px rgba(0,0,0,0.14);

    --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;

    --font-family-base: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    /* type scale: --fs-1 footnote < --fs-2 badge < --fs-3 body (most-used) < --fs-4 emphasis < --fs-5 hero-number */
    --fs-1: 12px; --fs-2: 13px; --fs-3: 14px; --fs-4: 16px; --fs-5: 22px;
    --fw-medium: 600; --fw-bold: 700;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface-canvas: rgb(31,31,31);
      --surface-card: rgb(37,36,36);
      --surface-sunken: rgb(24,24,24);
      --fg-default: rgb(245,245,245);
      --fg-secondary: rgb(214,214,214);
      --fg-tertiary: rgb(166,166,166);
      --border-default: rgb(61,59,57);
      --border-subtle: rgb(47,45,43);
      --border-strong: rgb(96,94,92);
      --brand-tint: rgba(49,130,246,0.28);
      --tint-alpha: 0.18;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --surface-canvas: rgb(31,31,31);
    --surface-card: rgb(37,36,36);
    --surface-sunken: rgb(24,24,24);
    --fg-default: rgb(245,245,245);
    --fg-secondary: rgb(214,214,214);
    --fg-tertiary: rgb(166,166,166);
    --border-default: rgb(61,59,57);
    --border-subtle: rgb(47,45,43);
    --border-strong: rgb(96,94,92);
    --brand-tint: rgba(49,130,246,0.28);
    --tint-alpha: 0.18;
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background: var(--surface-sunken);
    touch-action: pan-x pan-y;
  }
  body{
    font-family: var(--font-family-base);
    color: var(--fg-default);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button{ font-family: inherit; }

  .shell{
    display:flex; flex-direction:column;
    position: fixed; top:0; left:0; right:0;
    height: 100vh; height: 100dvh; /* dvh tracks the mobile browser's
      address bar collapsing/expanding; plain inset:0 stays pinned to the
      viewport size at load time and leaves a blank gap under the footer
      once the toolbar auto-hides */
    max-width: 520px; margin: 0 auto;
    background: var(--surface-sunken);
    overflow: hidden;
  }

  /* ---- header ---- */
  .header{
    flex: 0 0 auto;
    background: linear-gradient(135deg, rgb(var(--brand-primary-rgb)), var(--brand-primary-pressed));
    color: var(--fg-on-brand);
    padding: calc(env(safe-area-inset-top, 0px) + var(--space-5)) var(--space-5) var(--space-4);
  }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); }
  .header .title{ font-size: var(--fs-5); font-weight: var(--fw-bold); letter-spacing: -0.01em; text-wrap: balance; }
  .header .sub{ font-size: var(--fs-3); opacity: 0.9; margin-top: var(--space-1); }
  .dday-badge{
    flex-shrink:0; background: rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.32);
    border-radius: var(--radius-pill); padding: 6px 14px; font-size:var(--fs-2); font-weight:var(--fw-bold);
    letter-spacing:0.01em; white-space:nowrap;
  }

  /* ---- tab bar ---- */
  .tabbar{
    flex: 0 0 auto;
    display: flex;
    background: var(--surface-canvas);
    border-bottom: 1px solid var(--border-default);
    overflow-x: hidden;
  }
  .tab{
    flex: 1 1 0; min-width: 0; min-height: 44px;
    background: none; border: none; cursor: pointer;
    padding: var(--space-3) var(--space-1);
    border-bottom: 2px solid transparent;
    font-size: var(--fs-3); font-weight: var(--fw-bold); color: var(--fg-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab[aria-selected="true"]{
    color: rgb(var(--brand-primary-rgb));
    border-bottom-color: rgb(var(--brand-primary-rgb));
  }
  .tab:focus-visible{ outline: 2px solid rgb(var(--brand-primary-rgb)); outline-offset: -2px; }
  .tab:active{ opacity:0.6; }

  /* ---- day picker (inside the 일정 tab) ----
     plain prev/next paging — no dropdown, no per-day tap targets. */
  /* between two timeline icons the gap is has-connector's 24px PLUS a full
     place-text line (~24px) above the next icon; the day-picker has no
     place-text line under it, so its own margin needs to be doubled to
     land the first icon at the same visual distance. */
  .day-picker{ position:relative; margin-bottom: calc(var(--space-6) * 2); }
  .day-step-btn{
    width:28px; height:28px; flex-shrink:0; border-radius:50%; border:none;
    background:none; color: rgb(var(--brand-primary-rgb)); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .day-step-btn:disabled{ cursor:default; opacity:0.3; }
  .day-step-btn:active:not(:disabled){ opacity:0.6; }
  .day-step-btn:focus-visible{ outline: 2px solid rgb(var(--brand-primary-rgb)); outline-offset: 2px; }

  /* ---- content ---- */
  .content{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: var(--space-5);
    padding-left: var(--space-5);
    padding-right: var(--space-5);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--space-8));
    scrollbar-width: thin;
    scrollbar-color: var(--border-default) transparent;
  }
  .content::-webkit-scrollbar{ width: 6px; }
  .content::-webkit-scrollbar-track{ background: transparent; }
  .content::-webkit-scrollbar-thumb{ background: var(--border-default); border-radius: 3px; }
  .content::-webkit-scrollbar-thumb:hover{ background: var(--border-strong); }
  .screen{ animation: enter .22s ease; }
  @keyframes enter{ from{ opacity:0; transform: translateY(4px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  /* ---- home screen ---- */
  .section + .section{ margin-top: var(--space-6); }
  .section-label{
    display:flex; align-items:center; gap: 10px; min-height:28px;
    margin-bottom: var(--space-6);
  }
  .section-label .text{
    font-size: var(--fs-4); font-weight:var(--fw-bold); color: var(--fg-default);
    letter-spacing: -0.01em;
  }
  .card{
    background: var(--surface-canvas); border:1px solid var(--border-default);
    border-radius: var(--radius-large); padding: var(--space-4);
    box-shadow: var(--shadow-4);
  }
  .divider{ height:1px; background: var(--border-subtle); }
  .item-head{ display:flex; align-items:baseline; gap: var(--space-2); margin-bottom: 10px; }
  .item-direction{ font-size:var(--fs-3); font-weight:var(--fw-bold); }
  .item-date{ font-size: var(--fs-3); color: var(--fg-default); }

  .leg{ display:flex; flex-direction:column; }
  .leg .row{ display:flex; align-items:center; gap: var(--space-3); }
  .leg .stop{ text-align:center; flex:0 0 72px; }
  .leg .time{ font-size:var(--fs-4); font-weight:var(--fw-bold); color: var(--fg-default); font-variant-numeric: tabular-nums; }
  .city{ font-size:var(--fs-4); font-weight:var(--fw-bold); color: var(--fg-default); margin-top: var(--space-1); }
  .pending{ color: rgb(var(--status-danger-rgb)); }
  .leg .path{ flex:1; display:flex; flex-direction:column; align-items:center; gap: var(--space-1); min-width:0; }
  .leg .line-row{ width:100%; display:flex; align-items:center; gap: var(--space-2); }
  .leg .line{ flex:1; height:1px; background: var(--border-default); }
  .leg .flightno{ font-size: var(--fs-3); color: var(--fg-default); white-space:nowrap; }

  .stack{ display:flex; flex-direction:column; gap: var(--space-3); }

  /* ---- day timeline ---- */
  /* matches #expenseList's right inset below, so a day's times land at the
     same x as the expense tab's amounts */
  .timeline{ padding-right: var(--space-4); }
  .timeline-item{ position:relative; }
  .timeline-item.has-connector{ padding-bottom: var(--space-6); }
  .ti-top{ display:flex; align-items:center; gap: 10px; }
  .rail{ width:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
  .icon-dot{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 3px var(--surface-canvas);
  }
  .rail-line{ position:absolute; left:13px; width:2px; background: var(--border-default); top:28px; bottom:0; }
  .ti-rest{ padding-left: calc(28px + var(--space-2)); }
  .t-row{ display:flex; align-items:baseline; justify-content:space-between; gap: var(--space-2); flex:1; min-width:0; }
  .t-time{ font-size:var(--fs-4); font-weight:var(--fw-bold); font-variant-numeric: tabular-nums; flex-shrink:0; color: var(--fg-default); }
  .t-time.pending{ color: rgb(var(--status-danger-rgb)); }
  .t-title{ font-size:var(--fs-4); font-weight:var(--fw-medium); color:var(--fg-default); min-width:0; }
  .t-place{ font-size:var(--fs-3); color: var(--fg-tertiary); margin-top: var(--space-1); }

  /* ---- expense tab (styled like the day timeline for visual consistency) ---- */
  /* right inset matches .card's own padding, so amounts here land under 잔액 above,
     which sits inside a card (no card wrapper on this list anymore). */
  #expenseList{ padding-right: var(--space-4); }
  .exp-item{ cursor:pointer; }
  .exp-item:active{ opacity:0.6; }
  .exp-item:focus-visible, #balanceAmount:focus-visible{ outline: 2px solid rgb(var(--brand-primary-rgb)); outline-offset: 2px; border-radius: var(--radius-small); }

  .day-item{ cursor:pointer; }
  .day-item:active{ opacity:0.6; }
  .day-item:focus-visible{ outline: 2px solid rgb(var(--brand-primary-rgb)); outline-offset: 2px; border-radius: var(--radius-small); }

  .exp-day{ font-size:var(--fs-3); color: var(--fg-tertiary); margin-top: var(--space-1); }
  .exp-amount-wrap{ flex-shrink:0; }
  .add-btn{
    width:28px; height:28px; padding:0; border-radius:50%; flex-shrink:0; border:none; cursor:pointer;
    background: var(--brand-tint); color: rgb(var(--brand-primary-rgb));
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  /* keeps the visible circle at 28px but expands the tappable area to the
     44px accessibility minimum, invisibly, via ::before (hitSlop pattern) */
  .add-btn::before{ content:''; position:absolute; inset:-8px; }
  .add-btn:active{ opacity:0.7; }
  .budget-meter{
    margin-top: var(--space-3); height:8px; border-radius: var(--radius-pill);
    background: var(--surface-card); overflow:hidden;
  }
  .budget-meter-fill{ height:100%; border-radius: var(--radius-pill); transition: width .3s ease; }
  @media (prefers-reduced-motion: reduce){ .budget-meter-fill{ transition:none; } }
  .budget-stat-label{ font-size:var(--fs-3); color: var(--fg-tertiary); text-align:left; }
  .budget-stat-value{ font-size:var(--fs-4); font-weight:var(--fw-bold); color: var(--fg-default); font-variant-numeric: tabular-nums; text-align:right; }
  .budget-stat-value.danger{ color: rgb(var(--status-danger-rgb)); }
  /* 사용/잔액 share one grid so column 1 (label) always starts at the same
     x on both rows, regardless of how many digits each row's amount has;
     justify-content:end pushes the whole 2-column block to the card's
     right edge like the rest of the budget card. */
  .budget-rows{
    display:grid; grid-template-columns:auto auto; justify-content:end;
    align-items:baseline; gap: var(--space-1) var(--space-2);
  }
  .budget-balance{ display:contents; cursor:pointer; }

  /* ---- add-expense modal ----
     top-anchored (not centered): a vertically-centered panel gets computed
     against the full pre-keyboard height and ends up half-cut-off above
     the visible viewport once the keyboard opens. Anchoring to the top
     keeps it inside the part of the screen that stays visible regardless.
     No overflow-y here on purpose — an overflow:auto ancestor is exactly
     what iOS scrolls to "helpfully" bring a focused field into view, which
     is the panel-jumps-every-time-you-tap-a-field behavior this is meant
     to kill. The panel is short enough to fit without it; if it ever isn't,
     the bottom gets clipped instead of the whole thing lurching around. */
  .modal-backdrop{
    position:fixed; top:0; left:0; right:0; background:rgba(0,0,0,0.4);
    height: 100vh; height: 100dvh;
    display:none; align-items:flex-start; justify-content:center; z-index:100;
    padding: calc(env(safe-area-inset-top, 0px) + var(--space-5)) var(--space-5) var(--space-5);
    overflow:hidden;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-panel{
    background: var(--surface-canvas); border-radius: var(--radius-large);
    padding: var(--space-5); width:100%; max-width:340px; box-shadow: var(--shadow-4);
    flex-shrink:0;
  }
  .modal-title{ font-size:var(--fs-4); font-weight:var(--fw-bold); color: var(--fg-default); margin-bottom: var(--space-4); }
  .cat-picker{ display:flex; gap: var(--space-2); margin-bottom: var(--space-4); flex-wrap:wrap; }
  .cat-btn{
    width:40px; height:40px; border-radius:50%; border:2px solid transparent; position:relative;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .cat-btn::before{ content:''; position:absolute; inset:-2px; }
  .cat-btn.active{ border-color: currentColor; }
  .cat-btn:active{ opacity:0.7; }
  .field{ margin-bottom: var(--space-4); }
  .field label{ display:block; font-size:var(--fs-3); color: var(--fg-tertiary); margin-bottom: var(--space-1); }
  .field input{
    width:100%; box-sizing:border-box; border:1px solid var(--border-default); border-radius: var(--radius-medium);
    padding: var(--space-2) var(--space-3); font-size:16px; color: var(--fg-default);
    background: var(--surface-canvas); font-family: inherit;
  }
  .field input:focus{ outline:2px solid rgb(var(--brand-primary-rgb)); outline-offset:-1px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap: var(--space-2); }
  .btn-primary, .btn-secondary, .btn-danger{
    border:none; border-radius: var(--radius-medium); padding: var(--space-2) var(--space-4);
    font-size:var(--fs-3); font-weight:var(--fw-bold); cursor:pointer; font-family:inherit;
  }
  .btn-primary{ background: rgb(var(--brand-primary-rgb)); color:#fff; }
  .btn-secondary{ background: var(--surface-card); color: var(--fg-secondary); }
  .btn-danger{ background: var(--surface-card); color: rgb(var(--status-danger-rgb)); }
  .btn-primary:active, .btn-secondary:active, .btn-danger:active{ opacity:0.75; }

  /* icon-svg intentionally has no width/height rule here — the inline
     width/height attributes set per call in icon(name,size) control size;
     a CSS rule would win over those attributes and silently override them. */
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="header-row">
      <div>
        <div class="title">삿포로 여행</div>
        <div class="sub">8월 24일(월) - 8월 28일(금)</div>
      </div>
      <div class="dday-badge" id="ddayBadge"></div>
    </div>
  </div>

  <div class="tabbar" id="tabbar" role="tablist" aria-label="일정 탭"></div>

  <div class="content" id="content"></div>
</div>

<div class="modal-backdrop" id="expenseModalBackdrop">
  <div class="modal-panel">
    <div class="modal-title" id="modalTitle">지출 추가</div>
    <div class="cat-picker" id="catPicker"></div>
    <div class="field">
      <label for="expTitleInput">항목명</label>
      <input type="text" id="expTitleInput" placeholder="예: 저녁 식사">
    </div>
    <div class="field">
      <label for="expMemoInput">메모 (선택)</label>
      <input type="text" id="expMemoInput" placeholder="예: 트래블버킷 하나카드">
    </div>
    <div class="field">
      <label for="expAmountInput">금액</label>
      <input type="text" id="expAmountInput" placeholder="0" inputmode="numeric" pattern="[0-9,]*">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-danger" id="expDeleteBtn" style="display:none">삭제</button>
      <button type="button" class="day-step-btn" id="expMoveUpBtn" style="display:none" aria-label="위로 이동"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.41,15.41L12,10.83l4.59,4.58L18,14l-6,-6l-6,6z" fill="currentColor"/></svg></button>
      <button type="button" class="day-step-btn" id="expMoveDownBtn" style="display:none" aria-label="아래로 이동"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6l-6,-6z" fill="currentColor"/></svg></button>
      <div style="flex:1"></div>
      <button type="button" class="btn-secondary" id="expCancelBtn">취소</button>
      <button type="button" class="btn-primary" id="expAddBtn">추가</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="itemModalBackdrop">
  <div class="modal-panel">
    <div class="modal-title" id="itemModalTitle">일정 수정</div>
    <div class="cat-picker" id="itemCatPicker"></div>
    <div class="field">
      <label for="itemTitleInput">항목명</label>
      <input type="text" id="itemTitleInput" placeholder="예: 오도리 공원 산책">
    </div>
    <div class="field">
      <label for="itemTimeInput">시간</label>
      <input type="text" id="itemTimeInput" placeholder="예: 16:30 또는 오후">
    </div>
    <div class="field">
      <label for="itemPlaceInput">장소 (선택)</label>
      <input type="text" id="itemPlaceInput" placeholder="예: 스스키노">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-danger" id="itemDeleteBtn" style="display:none">삭제</button>
      <button type="button" class="day-step-btn" id="itemMoveUpBtn" style="display:none" aria-label="위로 이동"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.41,15.41L12,10.83l4.59,4.58L18,14l-6,-6l-6,6z" fill="currentColor"/></svg></button>
      <button type="button" class="day-step-btn" id="itemMoveDownBtn" style="display:none" aria-label="아래로 이동"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6l-6,-6z" fill="currentColor"/></svg></button>
      <div style="flex:1"></div>
      <button type="button" class="btn-secondary" id="itemCancelBtn">취소</button>
      <button type="button" class="btn-primary" id="itemSaveBtn">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="budgetModalBackdrop">
  <div class="modal-panel">
    <div class="modal-title">예산 변경</div>
    <div class="exp-day" id="currentBudgetLabel" style="margin-bottom:var(--space-4)"></div>
    <div class="field">
      <label for="budgetInput">새 예산</label>
      <input type="text" id="budgetInput" placeholder="0" inputmode="numeric" pattern="[0-9,]*">
    </div>

let DAY_TIMELINES = [null, [], [], [], [], []];

async function loadDayTimelines(){
  const { data, error } = await sb.from('day_items').select('*').order('day').order('position');
  if (error){ console.error(error); return; }
  let rows = data;
  if (rows.length === 0){
    rows = [];
    DEFAULT_DAY_TIMELINES.forEach((day, di) => {
      if (day === null) return;
      day.forEach((it, ii) => rows.push({ id:'d'+di+'-'+ii, day:di, cat:it.cat, time:it.time, title:it.title, place:it.place, position:ii }));
    });
    await sb.from('day_items').insert(rows); // awaited: if the page unloads before a fire-and-forget seed insert lands, the table stays empty and every load reseeds forever
  }
  const grouped = [null, [], [], [], [], []];
  rows.forEach(r => grouped[r.day].push(r));
  DAY_TIMELINES = grouped;
}

}

async function loadExpenses(){
  const { data, error } = await sb.from('expenses').select('*').order('position');

  if (data.length === 0){
    const seeded = DEFAULT_EXPENSES.map((e,i) => Object.assign({ id:'e'+i, position:i }, e));

    await sb.from('expenses').insert(seeded); // awaited, same reason as the day_items seed above

function deleteExpense(id){
  EXPENSES = EXPENSES.filter(e => e.id !== id);
  renderContent();
  sbWrite(sb.from('expenses').delete().eq('id', id));
}

function moveExpense(dir){
  const idx = EXPENSES.findIndex(e => e.id === editingId);
  const swapIdx = idx + dir;
  if (idx === -1 || swapIdx < 0 || swapIdx >= EXPENSES.length) return;
  [EXPENSES[idx], EXPENSES[swapIdx]] = [EXPENSES[swapIdx], EXPENSES[idx]];
  EXPENSES.forEach((e,i) => { e.position = i; });
  renderContent();
  updateExpMoveBtns();
  sbWrite(sb.from('expenses').update({ position:EXPENSES[idx].position }).eq('id', EXPENSES[idx].id));
  sbWrite(sb.from('expenses').update({ position:EXPENSES[swapIdx].position }).eq('id', EXPENSES[swapIdx].id));
}
function updateExpMoveBtns(){
  const idx = EXPENSES.findIndex(e => e.id === editingId);

/* every "add/edit X" modal (expense, day item) offers the same
   CAT_PICKER_CATS grid and only differs in which element it fills and
   which `selected*Cat` variable it reads/writes — one factory instead of
   two copies of the same render+click-binding logic. */
function makeCatPicker(elId, getSelected, setSelected){
  function render(){
    const el = document.getElementById(elId);
    el.innerHTML = CAT_PICKER_CATS.map(c =>
      '<button type="button" class="cat-btn'+(c.key === getSelected() ? ' active' : '')+'" data-cat="'+c.key+'" '
        + 'style="'+catStyle(c.key)+'" aria-label="'+c.label+'">'+icon(CAT[c.key].icon,18)+'</button>'
    ).join('');
    el.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => { setSelected(btn.dataset.cat); render(); });
    });
  }
  return render;
}

/* iOS Safari still auto-scrolls the page when a focused input is inside a
   `position:fixed` ancestor, no matter what that ancestor's own overflow
   is set to — the only thing that reliably stops it is putting `body`
   itself into `position:fixed` while a modal (and its keyboard) is open,
   so there's no document scroll position left for it to change. */
function lockBodyScroll(){
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.width = '';
}

  document.getElementById('expAddBtn').textContent = item ? '저장' : '추가';
  document.getElementById('expDeleteBtn').style.display = item ? '' : 'none';
  document.getElementById('expMoveUpBtn').style.display = item ? '' : 'none';
  document.getElementById('expMoveDownBtn').style.display = item ? '' : 'none';
  updateExpMoveBtns();
  document.getElementById('expTitleInput').value = item ? item.title : '';
  document.getElementById('expMemoInput').value = item && item.memo ? item.memo : '';
  document.getElementById('expAmountInput').value = item && item.amount != null ? item.amount.toLocaleString('ko-KR') : '';
  selectedAddCat = item ? item.cat : 'food';
  renderCatPicker();
  document.getElementById('expenseModalBackdrop').classList.add('open');
  lockBodyScroll();
  document.getElementById('expTitleInput').focus();
}
function closeExpenseModal(){
  document.getElementById('expenseModalBackdrop').classList.remove('open');
  unlockBodyScroll();
  editingId = null;
}
function submitExpense(){
  const title = document.getElementById('expTitleInput').value.trim();
  const memo = document.getElementById('expMemoInput').value.trim();
  const amountRaw = document.getElementById('expAmountInput').value.replace(/,/g, '');
  const amount = Number(amountRaw);
  if (!title || !amountRaw || !(amount > 0)) return;
  if (editingId){
    const item = EXPENSES.find(e => e.id === editingId);
    if (item){
      item.cat = selectedAddCat; item.title = title; item.memo = memo; item.amount = amount;
      sbWrite(sb.from('expenses').update({ cat:item.cat, title:item.title, memo:item.memo, amount:item.amount }).eq('id', item.id));
    }
  } else {
    const newItem = { id:'e'+Date.now(), cat: selectedAddCat, title: title, memo: memo, amount: amount, position: EXPENSES.length };
    EXPENSES.push(newItem);
    sbWrite(sb.from('expenses').insert(newItem));
  }
  closeExpenseModal();
  renderContent();
}

function liveFormatAmount(e){
  const digits = e.target.value.replace(/[^0-9]/g, '');
  e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
}
document.getElementById('expAmountInput').addEventListener('input', liveFormatAmount);
document.getElementById('expCancelBtn').addEventListener('click', closeExpenseModal);
document.getElementById('expAddBtn').addEventListener('click', submitExpense);
document.getElementById('expDeleteBtn').addEventListener('click', () => {
  if (editingId) deleteExpense(editingId);
  closeExpenseModal();
});
document.getElementById('expMoveUpBtn').addEventListener('click', () => moveExpense(-1));
document.getElementById('expMoveDownBtn').addEventListener('click', () => moveExpense(1));
document.getElementById('expenseModalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'expenseModalBackdrop') closeExpenseModal();
});
/* ---- day timeline item edit modal (mirrors the expense edit modal) ---- */
let selectedItemCat = 'food';
const renderItemCatPicker = makeCatPicker('itemCatPicker', () => selectedItemCat, (v) => { selectedItemCat = v; });

let editingDay = null;
let editingItemId = null;

function openItemModal(day, id){
  const item = id ? DAY_TIMELINES[day].find(it => it.id === id) : null;
  editingDay = day;
  editingItemId = item ? id : null;
  document.getElementById('itemModalTitle').textContent = item ? '일정 수정' : '일정 추가';
  document.getElementById('itemSaveBtn').textContent = item ? '저장' : '추가';
  document.getElementById('itemDeleteBtn').style.display = item ? '' : 'none';
  document.getElementById('itemMoveUpBtn').style.display = item ? '' : 'none';
  document.getElementById('itemMoveDownBtn').style.display = item ? '' : 'none';
  updateItemMoveBtns();
  document.getElementById('itemTitleInput').value = item ? item.title : '';
  document.getElementById('itemTimeInput').value = item ? item.time : '';
  document.getElementById('itemPlaceInput').value = item && item.place ? item.place : '';
  selectedItemCat = item ? item.cat : 'food';
  renderItemCatPicker();
  document.getElementById('itemModalBackdrop').classList.add('open');
  lockBodyScroll();
  document.getElementById('itemTitleInput').focus();
}
function closeItemModal(){
  document.getElementById('itemModalBackdrop').classList.remove('open');
  unlockBodyScroll();
  editingDay = null;
  editingItemId = null;
}
function submitItem(){
  const title = document.getElementById('itemTitleInput').value.trim();
  const time = document.getElementById('itemTimeInput').value.trim();
  const place = document.getElementById('itemPlaceInput').value.trim();
  if (!title || !time) return;
  const arr = DAY_TIMELINES[editingDay];
  if (editingItemId){
    const item = arr.find(it => it.id === editingItemId);
    if (item){
      item.cat = selectedItemCat; item.title = title; item.time = time; item.place = place;
      sbWrite(sb.from('day_items').update({ cat:item.cat, title:item.title, time:item.time, place:item.place }).eq('id', item.id));
    }
  } else {
    const newItem = { id:'d'+editingDay+'-'+Date.now(), day: editingDay, cat: selectedItemCat, title: title, time: time, place: place, position: arr.length };
    arr.push(newItem);
    sbWrite(sb.from('day_items').insert(newItem));
  }
  closeItemModal();
  renderContent();
}
function deleteItem(){
  const arr = DAY_TIMELINES[editingDay];
  const idx = arr.findIndex(it => it.id === editingItemId);
  if (idx === -1) return;
  const [removed] = arr.splice(idx, 1);
  closeItemModal();
  renderContent();
  sbWrite(sb.from('day_items').delete().eq('id', removed.id));
}
function moveItem(dir){
  const arr = DAY_TIMELINES[editingDay];
  const idx = arr.findIndex(it => it.id === editingItemId);
  const swapIdx = idx + dir;
  if (idx === -1 || swapIdx < 0 || swapIdx >= arr.length) return;
  [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
  arr.forEach((it,i) => { it.position = i; });
  renderContent();
  updateItemMoveBtns();
  sbWrite(sb.from('day_items').update({ position:arr[idx].position }).eq('id', arr[idx].id));
  sbWrite(sb.from('day_items').update({ position:arr[swapIdx].position }).eq('id', arr[swapIdx].id));
}
function updateItemMoveBtns(){
  const arr = DAY_TIMELINES[editingDay];
  const idx = arr.findIndex(it => it.id === editingItemId);
  document.getElementById('itemMoveUpBtn').disabled = idx <= 0;
  document.getElementById('itemMoveDownBtn').disabled = idx === -1 || idx >= arr.length - 1;
}

document.getElementById('itemCancelBtn').addEventListener('click', closeItemModal);
document.getElementById('itemSaveBtn').addEventListener('click', submitItem);
document.getElementById('itemDeleteBtn').addEventListener('click', deleteItem);
document.getElementById('itemMoveUpBtn').addEventListener('click', () => moveItem(-1));
document.getElementById('itemMoveDownBtn').addEventListener('click', () => moveItem(1));
document.getElementById('itemModalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'itemModalBackdrop') closeItemModal();
});

function goToDay(d){
  activeDay = d;
  renderContent();
  /* days differ a lot in length (5-item Day1 vs a 2-item free day), so
     without this the leftover scroll position can snap/jump once the
     shorter page settles */
  document.getElementById('content').scrollTop = 0;
}

document.getElementById('content').addEventListener('click', (e) => {
  if (e.target.closest('#addExpenseBtn')) { openExpenseModal(); return; }
  if (e.target.closest('#balanceAmount')) { openBudgetModal(); return; }
  const dayStepBtn = e.target.closest('[data-day-step]');
  if (dayStepBtn) {
    const next = activeDay + Number(dayStepBtn.dataset.dayStep);
    if (next >= 1 && next <= 5) goToDay(next);
    return;
  }
  const addDayBtn = e.target.closest('[data-add-day]');
  if (addDayBtn) { openItemModal(Number(addDayBtn.dataset.addDay)); return; }
  const expRow = e.target.closest('.exp-item[data-id]');
  if (expRow) { openExpenseModal(expRow.dataset.id); return; }
  const dayRow = e.target.closest('.day-item[data-id]');
  if (dayRow) { openItemModal(Number(dayRow.dataset.day), dayRow.dataset.id); return; }
});
document.getElementById('content').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (e.target.closest('#balanceAmount')) { e.preventDefault(); openBudgetModal(); return; }
  const expRow = e.target.closest('.exp-item[data-id]');
  if (expRow) { e.preventDefault(); openExpenseModal(expRow.dataset.id); return; }
  const dayRow = e.target.closest('.day-item[data-id]');
  if (dayRow) { e.preventDefault(); openItemModal(Number(dayRow.dataset.day), dayRow.dataset.id); }
});

function openBudgetModal(){
  document.getElementById('currentBudgetLabel').textContent = '현재 예산: '+formatWon(BUDGET);
  document.getElementById('budgetInput').value = BUDGET.toLocaleString('ko-KR');
  document.getElementById('budgetModalBackdrop').classList.add('open');
  lockBodyScroll();
  document.getElementById('budgetInput').focus();
}
function closeBudgetModal(){
  document.getElementById('budgetModalBackdrop').classList.remove('open');
  unlockBodyScroll();
}
function submitBudget(){
  const raw = document.getElementById('budgetInput').value.replace(/,/g, '');
  const val = Number(raw);
  if (!raw || !(val > 0)) return;
  BUDGET = val;
  closeBudgetModal();
  renderContent();
  sbWrite(sb.from('app_settings').upsert({ key:'budget', value: BUDGET }));
}
document.getElementById('budgetInput').addEventListener('input', liveFormatAmount);
document.getElementById('budgetCancelBtn').addEventListener('click', closeBudgetModal);
document.getElementById('budgetSaveBtn').addEventListener('click', submitBudget);
document.getElementById('budgetModalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'budgetModalBackdrop') closeBudgetModal();
});

const TABS = [
  { key:'home', label:'홈' },
  { key:'itinerary', label:'일정' },
  { key:'expense', label:'지출' },
];

let activeIndex = 0;
let activeDay = 1; // which Day1~5 is showing inside the 일정 tab

function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = TABS.map((t, i) =>
    '<button class="tab" role="tab" aria-selected="'+(i === activeIndex)+'" data-index="'+i+'">'+t.label+'</button>'
  ).join('');
  bar.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => setActive(Number(el.dataset.index)));
  });
}

const DAY_DATES = [
  null,
  { num:24, dow:'월' },
  { num:25, dow:'화' },
  { num:26, dow:'수' },
  { num:27, dow:'목' },
  { num:28, dow:'금' },
];

function renderItinerary(){
  const dd = DAY_DATES[activeDay];
  return (
    '<div class="day-picker">'
      + '<div style="position:relative;display:flex;align-items:center;justify-content:center;gap:6px">'
        + '<button type="button" class="day-step-btn" data-day-step="-1" aria-label="이전 날"'+(activeDay <= 1 ? ' disabled' : '')+'>'+icon('chevron-left',18)+'</button>'
        + '<div class="section-label" style="margin-bottom:0">'
          + '<div class="text">8월 '+dd.num+'일 ('+dd.dow+')</div>'
        + '</div>'
        + '<button type="button" class="day-step-btn" data-day-step="1" aria-label="다음 날"'+(activeDay >= 5 ? ' disabled' : '')+'>'+icon('chevron-right',18)+'</button>'
        + '<button type="button" class="add-btn" data-add-day="'+activeDay+'" aria-label="일정 추가" style="position:absolute;right:0;top:50%;transform:translateY(-50%)">'+icon('plus',16)+'</button>'
      + '</div>'
    + '</div>'
    + renderDay(activeDay)
  );
}

function renderContent(){
  const content = document.getElementById('content');
  const key = TABS[activeIndex].key;
  if (key === 'home') content.innerHTML = renderHome();
  else if (key === 'expense') { content.innerHTML = renderExpense(); }
  else { content.innerHTML = renderItinerary(); }
}

function setActive(i){
  if (i === activeIndex) return;
  activeIndex = i;
  renderTabs();
  renderContent();
  document.getElementById('content').scrollTop = 0;
}

function renderDday(){
  const toDay = (y,m,d) => new Date(y,m,d);
  const start = toDay(2026,7,24);
  const end = toDay(2026,7,28);
  const now = new Date();
  const today = toDay(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((start - today) / 86400000);
  const label = diff > 0 ? 'D-'+diff : (today <= end ? '여행 중' : '여행 종료');
  document.getElementById('ddayBadge').textContent = label;
}
/* any insert/update/delete on any of the three tables — from either phone,
   including this one's own writes — triggers a full refetch+re-render.
   The tables are tiny, so refetching the whole thing is simpler and safer
   than merging individual change events. */
function setupRealtime(){
  sb.channel('sapporo-sync')
    .on('postgres_changes', { event:'*', schema:'public', table:'expenses' }, async () => { await loadExpenses(); renderContent(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'day_items' }, async () => { await loadDayTimelines(); renderContent(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'app_settings' }, async () => { await loadBudget(); renderContent(); })
    .subscribe();
}

async function init(){
  renderDday();
  renderTabs();
  await Promise.all([loadExpenses(), loadDayTimelines(), loadBudget()]);
  renderContent();
  setupRealtime();
}
init();
</script>
